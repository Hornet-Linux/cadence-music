# Cadence server — self-hosted deployment.
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# The server listens on 127.0.0.1 only. For HTTPS, either enable the bundled
# Caddy (COMPOSE_PROFILES=https in .env plus a ./Caddyfile; setup.sh does
# both) or put your own reverse proxy in front. See docs/SELF_HOSTING.md.

name: cadence

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: cadence-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      MUSIC_DIR: /music
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    volumes:
      - music-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro

  # Optional HTTPS front door, enabled with COMPOSE_PROFILES=https.
  caddy:
    image: caddy:2.8.4
    profiles: [https]
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  music-data:
  caddy-data:
  caddy-config:
