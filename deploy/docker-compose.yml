# Cadence server — self-hosted deployment.
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# The server listens on 127.0.0.1 only. For HTTPS, either enable the bundled
# Caddy (COMPOSE_PROFILES=https in .env plus a ./Caddyfile; setup.sh does
# both) or put your own reverse proxy in front. See docs/SELF_HOSTING.md.
#
# The AI DJ can run on this server with a bundled Ollama: add "ollama" (CPU)
# or "ollama-gpu" (NVIDIA GPU) to COMPOSE_PROFILES and set
# OLLAMA_URL=http://ollama:11434. Ollama is only reachable by the server, never
# published on a port. See docs/AI_DJ.md.

name: cadence

# Shared by the CPU and GPU variants of the bundled Ollama.
x-ollama: &ollama
  image: ollama/ollama:0.40.8
  restart: unless-stopped
  environment:
    # Keep the model loaded between DJ sets so the next one starts quickly.
    OLLAMA_KEEP_ALIVE: 30m
  volumes:
    - ollama-models:/root/.ollama
  networks:
    default:
      aliases: [ollama]

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: cadence-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      MUSIC_DIR: /music
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    volumes:
      - music-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro

  # Optional AI DJ model server, enabled with COMPOSE_PROFILES=ollama ...
  ollama:
    <<: *ollama
    profiles: [ollama]

  # ... or with COMPOSE_PROFILES=ollama-gpu on a machine with an NVIDIA GPU
  # (needs the NVIDIA Container Toolkit).
  ollama-gpu:
    <<: *ollama
    profiles: [ollama-gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional HTTPS front door, enabled with COMPOSE_PROFILES=https.
  caddy:
    image: caddy:2.8.4
    profiles: [https]
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  music-data:
  ollama-models:
  caddy-data:
  caddy-config:
