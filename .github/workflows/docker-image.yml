# Builds the server image (apps/server/Dockerfile, which also bundles the web
# player) for amd64 and arm64 and publishes it to the GitHub Container Registry
# as ghcr.io/hornet-linux/cadence-music. GHCR image names must be lowercase,
# hence "hornet-linux" rather than the organisation's "Hornet-Linux".
#
# Tags published per event:
#   push to main            :main  :nightly  :sha-<short>
#   push to another branch  :<branch-slug>   (feat/plugins -> :feat-plugins)
#   tag vX.Y.Z              :X.Y.Z :X.Y :X :vX.Y.Z :vX.Y :vX, plus :latest
#   tag vX.Y.Z-rc.1         :X.Y.Z-rc.1 :vX.Y.Z-rc.1 only (no :latest, no short tags)
#   pull request            build only, nothing is pushed
#
# The functional smoke test of the image (sign up, play a track) lives in
# ci.yml's server-docker job; this workflow only builds and publishes, so the
# two never disagree about how the image is built (both use the same Dockerfile).

name: Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hornet-linux/cadence-music

jobs:
  image:
    name: Server image · build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned by commit, like the rest of the repo.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (pinned by commit: third-party action)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (pinned by commit: third-party action)

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.6.0 (pinned by commit: third-party action)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (pinned by commit: third-party action)
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: only the semver rules add :latest, and never for pre-releases.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=raw,value=nightly,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=pr
          # version and revision labels are added by the action itself.
          labels: |
            org.opencontainers.image.title=Cadence
            org.opencontainers.image.description=Cadence music server with the web player built in
            org.opencontainers.image.licenses=NOASSERTION
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build (and push unless this is a pull request)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (pinned by commit: third-party action)
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "### Server image"
            echo "Pushed: $PUSHED"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
