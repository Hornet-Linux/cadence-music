name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- desktop
  desktop-quality:
    name: Desktop · lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  desktop-test:
    name: Desktop · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage
          path: apps/desktop/coverage/
          if-no-files-found: error

  desktop-build:
    name: Desktop · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Build the web player
        run: npm run build:web
      - name: Ensure the build left tracked files unchanged
        run: git diff --exit-code
      - name: Upload renderer build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-renderer-dist
          path: apps/desktop/dist/
          if-no-files-found: error

  desktop-e2e:
    name: Desktop · launch smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Launch the app (Linux, virtual display) and take screenshots
        if: runner.os == 'Linux'
        env:
          E2E_SCREENSHOTS: "1"
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run e2e
      - name: Upload screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: apps/desktop/e2e/screenshots/
          if-no-files-found: warn
      - name: Launch the app (Windows, Widevine required)
        if: runner.os == 'Windows'
        env:
          E2E_REQUIRE_WIDEVINE: "1"
        run: npm run e2e

  desktop-package-windows:
    name: Desktop · Windows installer
    runs-on: windows-latest
    needs: [desktop-quality, desktop-test, desktop-build, desktop-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      # Optional: a free castlabs EVS account enables Widevine VMP signing,
      # which DRM services require of production Windows builds.
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        if: env.EVS_ACCOUNT_NAME != ''
        with:
          python-version: "3.12"
      - name: Sign in to castlabs EVS for VMP signing
        if: env.EVS_ACCOUNT_NAME != ''
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "VMP_SIGN=1" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run electron:build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  desktop-package-mac:
    name: Desktop · macOS app
    runs-on: macos-latest
    needs: [desktop-quality, desktop-test, desktop-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      # No Apple Developer certificate: the app is signed ad hoc in after-pack.cjs.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        if: env.EVS_ACCOUNT_NAME != ''
        with:
          python-version: "3.12"
      - name: Sign in to castlabs EVS for VMP signing
        if: env.EVS_ACCOUNT_NAME != ''
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
          echo "VMP_SIGN=1" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Build macOS disk images (Apple Silicon and Intel)
        run: npm run electron:build:mac
      - name: Check the apps are signed and launch
        run: |
          for app in release/mac*/Cadence.app; do
            codesign --verify --deep --strict "$app"
            echo "ok: $app"
          done
          app=$(ls -d release/mac-arm64/Cadence.app 2>/dev/null || ls -d release/mac/Cadence.app)
          "$app/Contents/MacOS/Cadence" --widevine-probe
      - name: Upload disk images
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  # ----------------------------------------------------------------- server
  server:
    name: Server · lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-server-${{ hashFiles('apps/server/package.json') }}
          restore-keys: ${{ runner.os }}-npm-server-
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Ensure tests left tracked files unchanged
        run: git diff --exit-code

  server-docker:
    name: Server · Docker image & smoke test
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/server/Dockerfile -t cadence-server:ci .
      - name: Smoke-test the running container
        run: bash .github/scripts/server-smoke-test.sh cadence-server:ci
      - name: Web player end-to-end (sign up, sign in, play) in Chromium
        run: bash .github/scripts/web-e2e.sh cadence-server:ci
        env:
          SHOTS: ${{ github.workspace }}/web-screenshots
      - name: Upload web player screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web-screenshots/
          if-no-files-found: warn
      - name: Lint shell scripts
        run: shellcheck -S error deploy/setup.sh deploy/install.sh .github/scripts/server-smoke-test.sh .github/scripts/web-e2e.sh
      - name: Run the setup wizard with scripted answers
        working-directory: deploy
        run: |
          # domain, own web server?, port, music files? (+folder, create it), local admin,
          # sign-up (+invite, code), OIDC (+6 answers), Spotify (+id), Apple Music,
          # AI DJ on this server (+model; no GPU on the runner), start now
          printf '%s\n' music.example.test y '' y /tmp/uma-setup-music y n y y friends-code \
            y https://auth.example.test/application/o/music/ music-app s3cret-value '' music-users music-admins \
            y 0123456789abcdef0123456789abcdef n y qwen3:4b n | bash setup.sh
          test "$(stat -c %a .env)" = 600
          test -d /tmp/uma-setup-music
          grep -qx "PUBLIC_URL='https://music.example.test'" .env
          grep -qx "HOST_PORT='8787'" .env
          grep -qx "MUSIC_PATH='/tmp/uma-setup-music'" .env
          grep -qx "OIDC_ISSUER='https://auth.example.test/application/o/music/'" .env
          grep -qx "OIDC_CLIENT_SECRET='s3cret-value'" .env
          grep -qx "OIDC_NAME='Authentik'" .env
          grep -qx "OIDC_ALLOWED_GROUPS='music-users'" .env
          grep -qx "SPOTIFY_CLIENT_ID='0123456789abcdef0123456789abcdef'" .env
          grep -qx "SIGNUP_MODE='invite'" .env
          grep -qx "SIGNUP_INVITE_CODE='friends-code'" .env
          grep -qx "COMPOSE_PROFILES='ollama'" .env
          grep -qx "OLLAMA_URL='http://ollama:11434'" .env
          grep -qx "OLLAMA_MODEL='qwen3:4b'" .env
          docker compose config --services | grep -qx ollama
          if docker compose config --services | grep -qx caddy || test -f Caddyfile; then echo "unexpected bundled Caddy"; exit 1; fi
          if grep -q ADMIN_PASSWORD .env; then echo "unexpected admin password"; exit 1; fi
          docker compose config --quiet
          # Re-running without confirming keeps the existing file.
          before=$(sha256sum .env)
          printf 'n\n' | bash setup.sh
          test "$before" = "$(sha256sum .env)"
          rm .env
      - name: Run the setup wizard for a streaming-only server
        working-directory: deploy
        run: |
          # domain, own web server? no (bundled Caddy), port, music files? no, admin,
          # sign-up, OIDC, Spotify, Apple Music, AI DJ, start now
          printf '%s\n' music.example.test n '' n n n n n n n n | bash setup.sh
          grep -qx "MUSIC_PATH='./music'" .env
          grep -qx "COMPOSE_PROFILES='https'" .env
          if grep -q OLLAMA_URL .env; then echo "unexpected Ollama"; exit 1; fi
          grep -q "reverse_proxy server:8787" Caddyfile
          docker compose config --services | grep -qx caddy
          grep -qx "SIGNUP_MODE='closed'" .env
          test -d music
          docker compose config --quiet
          rm -rf .env music Caddyfile
      - name: Validate the compose file with the example env
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ---------------------------------------------------------------- release
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop-package-windows, desktop-package-mac, server, server-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist
      - name: Create the release with the Windows and macOS installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          test -f dist/Cadence-Setup.exe
          test -f dist/Cadence-mac-arm64.dmg
          test -f dist/Cadence-mac-x64.dmg
          gh release create "$TAG" dist/Cadence-Setup.exe dist/Cadence-mac-arm64.dmg dist/Cadence-mac-x64.dmg --title "Cadence $TAG" --generate-notes

  # ---------------------------------------------------------------- nightly
  # Every push to main refreshes the rolling "Nightly" pre-release, so the
  # newest installers are one click away without signing in (see
  # .github/scripts/publish-nightly.sh). Tagged releases above are separate.
  nightly:
    name: Publish to the Nightly release
    runs-on: ubuntu-latest
    needs: [desktop-package-windows, desktop-package-mac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-nightly.sh dist/Cadence-Setup.exe dist/Cadence-mac-arm64.dmg dist/Cadence-mac-x64.dmg

  # ---------------------------------------------------------------- scripts
  scripts:
    name: Release scripts · shellcheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck .github/scripts/publish-nightly.sh .github/scripts/publish-nightly.test.sh
      - run: bash .github/scripts/publish-nightly.test.sh
