name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- desktop
  desktop-quality:
    name: Desktop · lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  desktop-test:
    name: Desktop · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage
          path: apps/desktop/coverage/
          if-no-files-found: error

  desktop-build:
    name: Desktop · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-desktop-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: ${{ runner.os }}-npm-desktop-
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Ensure the build left tracked files unchanged
        run: git diff --exit-code
      - name: Upload renderer build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-renderer-dist
          path: apps/desktop/dist/
          if-no-files-found: error

  desktop-package-windows:
    name: Desktop · Windows installer
    runs-on: windows-latest
    needs: [desktop-quality, desktop-test, desktop-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run electron:build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- server
  server:
    name: Server · lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-server-${{ hashFiles('apps/server/package.json') }}
          restore-keys: ${{ runner.os }}-npm-server-
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Ensure tests left tracked files unchanged
        run: git diff --exit-code

  server-docker:
    name: Server · Docker image & smoke test
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/server/Dockerfile -t unnamed-music-server:ci .
      - name: Smoke-test the running container
        run: bash .github/scripts/server-smoke-test.sh unnamed-music-server:ci
      - name: Validate the compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
