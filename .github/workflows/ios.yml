name: iOS

# Builds an unsigned Cadence.ipa for sideloading (Sideloadly, AltStore) with a
# free Apple ID, so no paid developer account is needed. See docs/IOS.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: iOS · unsigned IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      # Apple Intelligence (the Foundation Models framework) only exists in the
      # iOS 26 SDK, so build with the newest Xcode. The app still targets iOS 16+.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0 (pinned by commit: third-party action)
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Unit tests
        # Runs CadenceTests on an iPhone simulator. The Apple Intelligence test skips
        # itself without compatible hardware.
        run: |
          UDID=$(xcrun simctl list devices available iPhone -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              tail = runtime.split("iOS-")[-1]
              return [int(p) for p in tail.split("-") if p.isdigit()]
          runtimes = sorted((r for r, d in devices.items() if "iOS-" in r and d), key=version)
          print(devices[runtimes[-1]][0]["udid"])
          ')
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build
        env:
          # A release tag (v1.2.3) sets the app version; other builds keep the one in project.yml.
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=()
          if [ -n "$TAG_NAME" ]; then args+=("MARKETING_VERSION=${TAG_NAME#v}"); fi
          xcodebuild build \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ${args[@]+"${args[@]}"}
      - name: Package Cadence.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Cadence.app out/Payload/
          (cd out && zip -qry Cadence.ipa Payload)
          ls -la out/Cadence.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: apps/ios/out/Cadence.ipa
          if-no-files-found: error

  release:
    name: Attach Cadence.ipa to the release
    runs-on: ubuntu-latest
    needs: [ipa]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: dist
      - name: Upload (waits for the CI workflow to create the release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" dist/Cadence.ipa -R "$REPO" --clobber

  # Every push to main refreshes the rolling "Nightly" pre-release with the
  # unsigned IPA (see .github/scripts/publish-nightly.sh).
  nightly:
    name: Publish Cadence.ipa to the Nightly release
    runs-on: ubuntu-latest
    needs: [ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-nightly.sh dist/Cadence.ipa
