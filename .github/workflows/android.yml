name: Android

# Builds Cadence.apk for sideloading, runs the app's unit tests, and attaches the APK
# to the GitHub release on v* tags. See docs/ANDROID.md.
#
# Signing: with the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD repository secrets set, the APK is signed with your release key
# (updates only install over an older Cadence if the same key signed both). Without them
# (forks, pull requests, first run) it is signed with the Android debug key, so the build
# never fails for lack of secrets.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Android · APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4 (pinned by commit: third-party action)

      - name: Restore the release keystore (when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cadence-release.jks"
            {
              echo "CADENCE_KEYSTORE_FILE=$RUNNER_TEMP/cadence-release.jks"
              echo "CADENCE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CADENCE_KEY_ALIAS=$KEY_ALIAS"
              echo "CADENCE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "::notice::No release keystore secrets; signing with the Android debug key. Updates won't install over a build signed with a different key."
          fi

      - name: Unit tests and release build
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          args=(-PversionCode="$RUN_NUMBER")
          if [ "$IS_TAG" = "true" ]; then args+=(-PversionName="${REF_NAME#v}"); fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease "${args[@]}"

      - name: Package Cadence.apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Cadence.apk
          ls -la out/Cadence.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs out/Cadence.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/out/Cadence.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/test-results
          if-no-files-found: ignore

  release:
    name: Attach Cadence.apk to the release
    runs-on: ubuntu-latest
    needs: [apk]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Upload (waits for the CI workflow to create the release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" dist/Cadence.apk -R "$REPO" --clobber
